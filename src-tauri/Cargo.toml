[package]
name = "hanger"
version = "0.1.2"
description = "A cross-platform SQL database viewer and editor"
authors = ["Artashes Soghomonyan"]
license = "MIT"
repository = "https://github.com/ArtashesSoghomonyan/hanger"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
